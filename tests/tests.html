<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Portfolio tests</title></head>
<body style="font:15px/1.6 system-ui, sans-serif; padding:16px">
<h1>Portfolio tests</h1>
<main id="results"></main>
<script src="../js/content.js"></script>
<script src="../js/render.js"></script>
<script src="../js/iso.js"></script>
<script src="../js/walk.js"></script>
<script src="../js/coffee.js"></script>
<script src="test-kit.js"></script>
<script>
const KEYS = ["about","experience","projects","toolkit","education","contact"];

test("every section has a menu name and an object", () => {
  KEYS.forEach(k => {
    assertEqual(typeof SITE.sections[k].menu, "string", k + " menu");
    assertEqual(typeof SITE.sections[k].object, "string", k + " object");
  });
});
test("no private details in content", () => {
  const all = JSON.stringify(SITE);
  [/\+47/, /Storhaugen/, /1999/, /Samboer/i, /Gjøse/, /Bratten/].forEach(rx =>
    assertEqual(rx.test(all), false, "forbidden " + rx));
});
test("exactly one featured project", () => {
  assertEqual(SITE.projects.filter(p => p.featured).length, 1, "featured");
});
test("certificates are newest first", () => {
  const order = SITE.certificates.map(c => c.sortKey);
  assertEqual(order, [...order].sort().reverse(), "order");
});

test("esc escapes HTML", () => assertEqual(esc(`<a & "b">`), "&lt;a &amp; &quot;b&quot;&gt;", "esc"));
test("projects panel shows the featured card first", () => {
  const html = renderSection("projects");
  assertEqual(html.indexOf("Unifying customer service") < html.indexOf("Placeholder project"), true, "order");
  assertEqual(html.includes("My contribution"), true, "label");
});
test("missing optional fields never print undefined", () => {
  KEYS.forEach(k => assertEqual(renderSection(k).includes("undefined"), false, k));
});
test("placeholders are labelled", () => assertEqual(renderSection("projects").includes("Placeholder"), true, "projects"));
test("education has a certificates and education toggle", () => {
  const html = renderSection("education");
  assertEqual(html.includes('data-tab="certs"') && html.includes('data-tab="edu"'), true, "tabs");
});
test("certificate without validUntil or issuer shows only its name", () => {
  assertEqual(renderSection("education").includes("<b>Lean Green Belt</b></span>"), true, "lean");
});
test("special characters in content render as text", () => {
  assertEqual(renderSection("education").includes("videregående"), true, "unicode");
  assertEqual(renderSection("projects").includes("Zendesk&#39;s customer story"), true, "apostrophe escaped");
});

test("iso maps one unit along x", () => assertEqual(iso(1,0,0).map(v => +v.toFixed(2)), [17.32, 10], "x"));
test("iso lifts by z", () => assertEqual(iso(0,0,1), [0, -20], "z"));
test("shade returns hex", () => assertEqual(shade("#808080", 0.5), "#404040", "shade"));
test("shade clamps at white", () => assertEqual(shade("#ffffff", 2), "#ffffff", "clamp"));

test("path goes around a blocker", () => {
  const wall = [{ x: 4, y: 0, w: 1, d: 8 }];
  const path = findPath(wall, 2, 2, 7, 2);
  assertEqual(path.length > 0, true, "found");
  assertEqual(path.some(p => p.x > 3.6 && p.x < 5.4 && p.y < 8.3), false, "never crosses the blocker");
  const end = path[path.length - 1];
  assertEqual([end.x, end.y], [7.25, 2.25], "ends at target cell centre");
});
test("path to a blocked spot ends at the nearest free cell", () => {
  const desk = [{ x: 4, y: 4, w: 2, d: 2 }];
  const end = findPath(desk, 1, 1, 5, 5).slice(-1)[0];
  assertEqual(desk.some(f => end.x > f.x - 0.3 && end.x < f.x + f.w + 0.3 && end.y > f.y - 0.3 && end.y < f.y + f.d + 0.3), false, "free");
});
test("walking from a spot to itself is an empty path", () => assertEqual(findPath([], 3, 3, 3.1, 3.1).length, 1, "single cell"));

test("resume lists every section in menu order", () => {
  const html = renderResume();
  const pos = ["About me","Experience","Projects","My toolkit","Education and certifications","Contact"].map(t => html.indexOf(">" + t + "<"));
  assertEqual(pos.every((p, i) => p >= 0 && (i === 0 || p > pos[i - 1])), true, "order");
});
test("resume shows both education lists without a toggle", () => {
  const html = renderResume();
  assertEqual(html.includes("data-tab"), false, "no toggle");
  assertEqual(html.includes("Lean Green Belt") && html.includes("BI Norwegian Business School"), true, "both lists");
});

test("only the featured project carries the Featured label", () => {
  const html = renderSection("projects");
  assertEqual((html.match(/Featured project/g) || []).length, SITE.projects.filter(p => p.featured).length, "chips");
});
test("TV 2 project is shown with its own heading", () => {
  assertEqual(renderSection("projects").includes("Handling the TV 2 surge at Lyse Dialog"), true, "title");
});

function memoryStore(){ const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); } }; }
test("coffee counter starts at zero and counts up", () => {
  const store = memoryStore();
  assertEqual(coffeeCount(store), 0, "start");
  addCoffee(store); addCoffee(store);
  assertEqual(coffeeCount(store), 2, "after two");
});
test("coffee counter is kept for the rest of the visit", () => {
  const store = memoryStore();
  addCoffee(store); addCoffee(store); addCoffee(store);
  assertEqual(store.getItem("mp-coffees"), "3", "stored");
  assertEqual(coffeeCount(store), 3, "read back");
});
test("coffee counter still counts when storage is blocked", () => {
  const blocked = { getItem(){ throw new Error("blocked"); }, setItem(){ throw new Error("blocked"); } };
  const before = coffeeCount(blocked);
  addCoffee(blocked);
  assertEqual(coffeeCount(blocked), before + 1, "in memory");
});
test("coffee label reads naturally", () => {
  assertEqual(coffeeLabel(0), "COFFEE #0", "zero");
  assertEqual(coffeeLabel(1), "COFFEE #1", "one");
  assertEqual(coffeeLabel(12), "COFFEE #12", "many");
});

test("about shows the personal intro once, with its own heading", () => {
  const html = renderSection("about");
  assertEqual((html.match(/>About me</g) || []).length, 1, "About me appears once");
  assertEqual(html.includes("<h2>Personal intro</h2>"), true, "heading");
  assertEqual(html.includes("Placeholder"), false, "no placeholder");
  assertEqual((html.match(/<p>/g) || []).length, 3, "three paragraphs");
  assertEqual(html.includes("based in Stavanger"), true, "text");
});
test("experience heading uses first-tier agent wording", () => {
  assertEqual(renderSection("experience").includes("From first-tier agent to the Zendesk admin"), true, "heading");
});

test("featured project shows its key numbers", () => {
  const html = renderSection("projects");
  assertEqual((html.match(/class="kpi"/g) || []).length, SITE.projects[0].keyNumbers.length, "tiles");
  assertEqual(html.indexOf('class="kpis"') < html.indexOf("<dl>"), true, "numbers come before the details");
});
test("projects without key numbers show no number tiles", () => {
  const tv2 = SITE.projects.find(p => p.title.startsWith("Handling the TV 2"));
  assertEqual(tv2.keyNumbers === undefined, true, "fixture");
  const html = renderSection("projects");
  const tv2Part = html.slice(html.indexOf("Handling the TV 2"));
  assertEqual(tv2Part.includes('class="kpi"'), false, "no tiles on TV 2");
});
test("featured project credits the deck's results to the team", () => {
  assertEqual(SITE.projects[0].credit.includes("team"), true, "credit");
});

test("about me opens with the portrait and the headline", () => {
  const html = renderSection("about");
  assertEqual(html.includes('class="portrait"') && html.includes('alt="Portrait of Mattias Paul"'), true, "portrait");
  assertEqual(html.includes(esc(SITE.person.headline)), true, "headline");
  assertEqual(html.indexOf('class="portrait"') < html.indexOf("<p>I started"), true, "before the intro text");
});

test("title uses the @ form", () => assertEqual(SITE.person.title, "Senior Consultant @ Kundelab", "title"));
</script>
</body>
</html>
