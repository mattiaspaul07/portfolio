<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Portfolio tests</title></head>
<body style="font:15px/1.6 system-ui, sans-serif; padding:16px">
<h1>Portfolio tests</h1>
<main id="results"></main>
<script src="../js/content.js"></script>
<script src="../js/render.js"></script>
<script src="../js/iso.js"></script>
<script src="../js/walk.js"></script>
<script src="../js/coffee.js"></script>
<script src="test-kit.js"></script>
<script>
const KEYS = ["about","experience","projects","toolkit","education","contact"];

test("every section has a menu name and an object", () => {
  KEYS.forEach(k => {
    assertEqual(typeof SITE.sections[k].menu, "string", k + " menu");
    assertEqual(typeof SITE.sections[k].object, "string", k + " object");
  });
});
test("no private details in content", () => {
  const all = JSON.stringify(SITE);
  [/\+47/, /Storhaugen/, /1999/, /Samboer/i, /Gjøse/, /Bratten/].forEach(rx =>
    assertEqual(rx.test(all), false, "forbidden " + rx));
});
test("exactly one featured project", () => {
  assertEqual(SITE.projects.filter(p => p.featured).length, 1, "featured");
});
test("certificates are newest first", () => {
  const order = SITE.certificates.map(c => c.sortKey);
  assertEqual(order, [...order].sort().reverse(), "order");
});

test("esc escapes HTML", () => assertEqual(esc(`<a & "b">`), "&lt;a &amp; &quot;b&quot;&gt;", "esc"));
test("projects panel shows the featured card first", () => {
  const html = renderSection("projects");
  assertEqual(html.indexOf("Unifying customer service") >= 0 && html.indexOf("Unifying customer service") < html.indexOf("Handling the TV 2 surge"), true, "order");
  assertEqual(html.includes("<dt>My role</dt>"), true, "label");
});
test("missing optional fields never print undefined", () => {
  KEYS.forEach(k => assertEqual(renderSection(k).includes("undefined"), false, k));
});
test("placeholders are labelled", () => assertEqual(placeholderBox({ title: "Placeholder project", text: "Waiting." }).includes("<b>Placeholder project.</b>"), true, "label"));
test("no placeholders are left on the site", () => {
  KEYS.forEach(k => assertEqual(renderSection(k).includes("Placeholder"), false, k));
});
test("education has a certificates and education toggle", () => {
  const html = renderSection("education");
  assertEqual(html.includes('data-tab="certs"') && html.includes('data-tab="edu"'), true, "tabs");
});
test("certificate without validUntil or issuer shows only its name", () => {
  assertEqual(renderSection("education").includes("<b>Lean Green Belt</b></span>"), true, "lean");
});
test("special characters in content render as text", () => {
  assertEqual(renderSection("education").includes("videregående"), true, "unicode");
  assertEqual(renderSection("projects").includes("Zendesk&#39;s customer story"), true, "apostrophe escaped");
});

test("iso maps one unit along x", () => assertEqual(iso(1,0,0).map(v => +v.toFixed(2)), [17.32, 10], "x"));
test("iso lifts by z", () => assertEqual(iso(0,0,1), [0, -20], "z"));
test("shade returns hex", () => assertEqual(shade("#808080", 0.5), "#404040", "shade"));
test("shade clamps at white", () => assertEqual(shade("#ffffff", 2), "#ffffff", "clamp"));

test("path goes around a blocker", () => {
  const wall = [{ x: 4, y: 0, w: 1, d: 8 }];
  const path = findPath(wall, 2, 2, 7, 2);
  assertEqual(path.length > 0, true, "found");
  assertEqual(path.some(p => p.x > 3.6 && p.x < 5.4 && p.y < 8.3), false, "never crosses the blocker");
  const end = path[path.length - 1];
  assertEqual([end.x, end.y], [7.25, 2.25], "ends at target cell centre");
});
test("path to a blocked spot ends at the nearest free cell", () => {
  const desk = [{ x: 4, y: 4, w: 2, d: 2 }];
  const end = findPath(desk, 1, 1, 5, 5).slice(-1)[0];
  assertEqual(desk.some(f => end.x > f.x - 0.3 && end.x < f.x + f.w + 0.3 && end.y > f.y - 0.3 && end.y < f.y + f.d + 0.3), false, "free");
});
test("walking from a spot to itself is an empty path", () => assertEqual(findPath([], 3, 3, 3.1, 3.1).length, 1, "single cell"));

test("resume lists every section in menu order", () => {
  const html = renderResume();
  const pos = ["About me","Experience","Projects","My toolkit","Education and certifications","Contact"].map(t => html.indexOf(">" + t + "<"));
  assertEqual(pos.every((p, i) => p >= 0 && (i === 0 || p > pos[i - 1])), true, "order");
});
test("resume shows both education lists without a toggle", () => {
  const html = renderResume();
  assertEqual(html.includes("data-tab"), false, "no toggle");
  assertEqual(html.includes("Lean Green Belt") && html.includes("BI Norwegian Business School"), true, "both lists");
});

test("only the featured project carries the Featured label", () => {
  const html = renderSection("projects");
  assertEqual((html.match(/Featured project/g) || []).length, SITE.projects.filter(p => p.featured).length, "chips");
});
test("TV 2 project is shown with its own heading", () => {
  assertEqual(renderSection("projects").includes("Handling the TV 2 surge at Lyse Dialog"), true, "title");
});

function memoryStore(){ const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); } }; }
test("coffee counter starts at zero and counts up", () => {
  const store = memoryStore();
  assertEqual(coffeeCount(store), 0, "start");
  addCoffee(store); addCoffee(store);
  assertEqual(coffeeCount(store), 2, "after two");
});
test("coffee counter is kept for the rest of the visit", () => {
  const store = memoryStore();
  addCoffee(store); addCoffee(store); addCoffee(store);
  assertEqual(store.getItem("mp-coffees"), "3", "stored");
  assertEqual(coffeeCount(store), 3, "read back");
});
test("coffee counter still counts when storage is blocked", () => {
  const blocked = { getItem(){ throw new Error("blocked"); }, setItem(){ throw new Error("blocked"); } };
  const before = coffeeCount(blocked);
  addCoffee(blocked);
  assertEqual(coffeeCount(blocked), before + 1, "in memory");
});
test("coffee label reads naturally", () => {
  assertEqual(coffeeLabel(0), "COFFEE #0", "zero");
  assertEqual(coffeeLabel(1), "COFFEE #1", "one");
  assertEqual(coffeeLabel(12), "COFFEE #12", "many");
});

test("about shows the personal intro once, with its own heading", () => {
  const html = renderSection("about");
  assertEqual((html.match(/>About me</g) || []).length, 1, "About me appears once");
  assertEqual(html.includes("<h2>Personal intro</h2>"), true, "heading");
  assertEqual(html.includes("Placeholder"), false, "no placeholder");
  assertEqual((html.match(/<p>/g) || []).length, 3, "three paragraphs");
  assertEqual(html.includes("Based in Stavanger. Always curious. Have a look around my digital workspace. My avatar will show you around!"), true, "closing line");
  assertEqual(SITE.person.headline, "Hi, I'm Mattias. I connect people, processes and technology.", "headline");
});
test("experience heading uses first-tier agent wording", () => {
  assertEqual(renderSection("experience").includes("From first-tier agent to the Zendesk admin"), true, "heading");
});

test("featured project shows its key numbers", () => {
  const html = renderSection("projects");
  assertEqual((html.match(/class="kpi( primary)?"/g) || []).length, SITE.projects[0].keyNumbers.length, "tiles");
  assertEqual(html.indexOf('class="kpis"') < html.indexOf("<dl>"), true, "numbers come before the details");
});
test("projects without key numbers show no number tiles", () => {
  const tv2 = SITE.projects.find(p => p.title.startsWith("Handling the TV 2"));
  assertEqual(tv2.keyNumbers === undefined, true, "fixture");
  const html = renderSection("projects");
  const tv2Part = html.slice(html.indexOf("Handling the TV 2"));
  assertEqual(tv2Part.includes('class="kpi"'), false, "no tiles on TV 2");
});
test("featured project credits the deck's results to the team", () => {
  assertEqual(SITE.projects[0].credit.includes("team"), true, "credit");
});

test("about me opens with the portrait and the headline", () => {
  const html = renderSection("about");
  assertEqual(html.includes('class="portrait"') && html.includes('alt="Portrait of Mattias Paul"'), true, "portrait");
  assertEqual(html.includes(esc(SITE.person.headline)), true, "headline");
  assertEqual(html.indexOf('class="portrait"') < html.indexOf("<p>I started as an agent in first line support"), true, "before the intro text");
});

test("title uses the @ form", () => assertEqual(SITE.person.title, "Senior Consultant @ Kundelab", "title"));

test("About me is the default section", () => {
  assertEqual(DEFAULT_SECTION, "about", "default");
  assertEqual(renderSection("unknown-key").includes("Personal intro"), true, "unknown keys fall back to About me");
});

test("Lean Green Belt is dated March 2023", () => {
  const lean = SITE.certificates.find(c => c.name === "Lean Green Belt");
  assertEqual(lean.issued, "Mar 2023", "issued");
  assertEqual(lean.sortKey, "2023-03", "sort key");
});

test("running story is an extra, not a section", () => {
  assertEqual(SITE.sections.running === undefined, true, "no section");
  assertEqual(SITE.extras.running.title, "On the track", "title");
  assertEqual(SITE.extras.running.paragraphs.length, 2, "two paragraphs");
  assertEqual(SITE.extras.running.paragraphs[0].includes("an Olympic champion"), true, "wording");
});
test("running story renders with its own label", () => {
  const html = renderSection("running");
  assertEqual(html.includes(">Behind the door<") && html.includes("<h2>On the track</h2>"), true, "heading");
  assertEqual(html.includes("Ingebrigtsen"), true, "story text");
});
test("running story stays out of the résumé", () => assertEqual(renderResume().includes("On the track"), false, "resume"));

test("running story shows its photos with descriptions", () => {
  const html = renderSection("running");
  const imgs = html.match(/<img [^>]+>/g) || [];
  assertEqual(imgs.length, SITE.extras.running.photos.length, "one img per photo");
  assertEqual(imgs.every(t => /alt="[^"]{10,}"/.test(t) && /width="\d+"/.test(t) && /height="\d+"/.test(t)), true, "alt text and size on every photo");
  assertEqual((html.match(/<figcaption>/g) || []).length, SITE.extras.running.photos.length, "captions");
});
test("first photo comes before the story, the second after it", () => {
  const html = renderSection("running");
  assertEqual(html.indexOf("track-mountains.jpg") < html.indexOf("<p>I ran"), true, "hero first");
  assertEqual(html.indexOf("track-bike.jpg") > html.indexOf("Curiosity and steady practice"), true, "second after text");
});

test("featured project shows a before/after workflow", () => {
  const rows = SITE.projects[0].workflow;
  assertEqual(Array.isArray(rows) && rows.length >= 3, true, "rows");
  const html = renderSection("projects");
  assertEqual(html.includes('class="beforeafter"'), true, "block");
  assertEqual((html.match(/class="ba-row"/g) || []).length, rows.length, "one row per step");
  assertEqual(html.indexOf('class="beforeafter"') > html.indexOf("<dt>Outcome</dt>"), true, "after the details");
});
test("before/after rows label both sides for screen readers", () => {
  const html = renderSection("projects");
  const row = html.slice(html.indexOf('class="ba-row"'), html.indexOf('class="ba-row"') + 600);
  assertEqual(row.includes("Before") && row.includes("After"), true, "labels");
});

test("coffee topics are the four chosen ones", () => {
  assertEqual(SITE.coffeeTopics, ["Why I go on about omnichannel routing", "A knowledge base that helps both sides", "Views and groups that won’t become a jungle", "Training with the Ingebrigtsen brothers"], "topics");
});
test("each coffee brings the next topic, then starts over", () => {
  assertEqual(coffeeTopic(1), "Why I go on about omnichannel routing", "first coffee");
  assertEqual(coffeeTopic(2), "A knowledge base that helps both sides", "second");
  assertEqual(coffeeTopic(4), "Training with the Ingebrigtsen brothers", "fourth");
  assertEqual(coffeeTopic(5), "Why I go on about omnichannel routing", "wraps");
  assertEqual(coffeeTopic(0), "Why I go on about omnichannel routing", "zero is safe");
});
test("coffee topics are short enough for the bubble", () => {
  SITE.coffeeTopics.forEach(t => assertEqual(t.length <= 48, true, t));
});

test("featured project has no Tools line", () => {
  const html = renderSection("projects");
  const featured = html.slice(0, html.indexOf("Handling the TV 2 surge"));
  assertEqual(featured.includes("<dt>Tools</dt>"), false, "featured");
  assertEqual(html.slice(html.indexOf("Handling the TV 2 surge")).includes("<b>Tools:</b> Puzzel, Zendesk"), true, "TV 2 keeps its tools, inside How I built it");
});

function projectParts() {
  const html = renderSection("projects");
  const i = html.indexOf("Handling the TV 2 surge");
  return [html.slice(0, i), html.slice(i)];
}
test("project cards lead with problem, role with three actions, and outcome", () => {
  SITE.projects.filter(p => !p.placeholder).forEach(p => assertEqual(p.actions.length, 3, p.title + " actions"));
  projectParts().forEach((part, i) => {
    assertEqual(part.includes("<dt>Problem</dt>") && part.includes("<dt>My role</dt>") && part.includes("<dt>Outcome</dt>"), true, "labels " + i);
    assertEqual((part.match(/<li>/g) || []).length >= 3, true, "actions listed " + i);
    assertEqual(part.indexOf("<dt>Problem</dt>") < part.indexOf("<dt>My role</dt>") && part.indexOf("<dt>My role</dt>") < part.indexOf("<dt>Outcome</dt>"), true, "order " + i);
  });
});
test("technical detail sits behind How I built it", () => {
  const [featured, tv2] = projectParts();
  assertEqual(featured.includes("<summary>How I built it</summary>") && tv2.includes("<summary>How I built it</summary>"), true, "toggles");
  assertEqual(featured.indexOf("Bump-Bump-Solve") > featured.indexOf("<details"), true, "jargon inside the toggle");
  assertEqual(featured.indexOf('class="beforeafter"') > featured.indexOf("<details"), true, "workflow inside the toggle");
  assertEqual(/<details[^>]* open>/.test(featured), false, "closed on the site");
});
test("résumé shows the technical detail expanded", () => {
  assertEqual(/<details[^>]* open>/.test(renderResume()), true, "open in résumé");
});

test("key numbers show outcomes only, with handling time as the main one", () => {
  const k = SITE.projects[0].keyNumbers;
  assertEqual(k.length, 2, "two tiles");
  assertEqual(k[0].value === "29 min → 5 min" && k[0].primary === true, true, "handling time first and primary");
  assertEqual(k.some(x => x.value === "3 days"), false, "no configuration tile");
  const html = renderSection("projects");
  assertEqual((html.match(/class="kpi primary"/g) || []).length, 1, "one primary tile");
});
test("backlog tile says what it measures and credits the staffing response", () => {
  const backlog = SITE.projects[0].keyNumbers[1];
  assertEqual(/backlog/i.test(backlog.label) && /opening hours/.test(backlog.label) && /agents/.test(backlog.label), true, backlog.label);
  assertEqual(/opening hours/.test(SITE.projects[0].outcome) && /agents/.test(SITE.projects[0].outcome), true, "outcome credits the staffing response");
});

test("project action lists use their own class, not the header's", () => {
  const html = renderSection("projects");
  assertEqual(html.includes('<ul class="key-actions">'), true, "own class");
  assertEqual(html.includes('class="actions"'), false, "no clash with the header button group");
});

test("contact has the new heading, intro, two actions and icebreakers", () => {
  const html = renderSection("contact");
  assertEqual(html.includes("<h2>Let’s talk. Coffee optional.</h2>"), true, "heading");
  assertEqual(html.includes("Untangling a Zendesk setup, looking for someone to join your next project, or just fancy comparing notes? Say hello."), true, "intro");
  assertEqual(html.includes('href="mailto:' + SITE.person.email + '"') && html.includes(">Email me<"), true, "email action");
  assertEqual(html.includes(">Connect on LinkedIn<"), true, "LinkedIn action");
  assertEqual(html.includes("Need an icebreaker? Ask me about:"), true, "icebreaker intro");
  assertEqual((html.match(/<li>/g) || []).length, 3, "three icebreakers");
  assertEqual(html.includes(SITE.person.email + "</code>"), true, "address still visible for copying");
});
</script>
</body>
</html>
