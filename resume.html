<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mattias Paul, résumé</title>
  <meta name="description" content="Résumé of Mattias Paul, Senior Consultant at Kundelab.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="resume-page">
  <header class="topbar">
    <div class="brand">Mattias Paul<small>Senior Consultant, Kundelab</small></div>
    <div class="actions">
      <a class="ghost" href="index.html">Back to the workspace</a>
      <a class="cta" href="assets/Mattias-Paul-CV.pdf" download>Download CV</a>
    </div>
  </header>
  <main class="resume panel" id="resume">
    <div class="hello">
      <img class="portrait" src="assets/portrait.jpg" width="96" height="96" alt="Portrait of Mattias Paul">
      <h1>Hi, I'm Mattias. I connect people, processes and technology.</h1>
    </div>
  </main>
  <script src="js/content.js"></script>
  <script src="js/render.js"></script>
  <script>
    document.getElementById("resume").insertAdjacentHTML("beforeend", renderResume());
    document.addEventListener("click", e => {
      const copy = e.target.closest("[data-copy]");
      if (!copy) return;
      try { navigator.clipboard.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied"; }, () => { copy.textContent = "Select the address"; }); }
      catch (_) { copy.textContent = "Select the address"; }
    });
  </script>
</body>
</html>
