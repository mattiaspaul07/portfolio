<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mattias Paul, reading view</title>
  <meta name="description" content="Mattias Paul, Senior Consultant at Kundelab: experience, projects, toolkit and contact in one simple page.">
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Vercel Web Analytics: cookie-free page view counting, visible only in the Vercel dashboard -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="resume-page">
  <header class="topbar">
    <div class="brand">Mattias Paul<small>Senior Consultant @ Kundelab</small></div>
    <div class="actions">
      <a class="ghost" href="index.html" data-i18n="interactiveView">Interactive view</a>
      <a class="cta" href="assets/Mattias-Paul-CV.pdf" download data-cv data-i18n="cvButton">Download CV</a>
    </div>
  </header>
  <main class="resume panel" id="resume">
    <h1 class="visually-hidden" data-i18n="readingTitle">Mattias Paul, reading view</h1>
    <p class="print-only cv-site"><span data-i18n="interactiveVersion">Interactive version:</span> <a data-site href="https://mattiaspaul.app/?utm_source=cv">mattiaspaul.app</a></p>
  </main>
  <script src="js/content.js"></script>
  <script src="js/content-no.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/render.js"></script>
  <script>
    document.getElementById("resume").insertAdjacentHTML("beforeend", renderResume());
    applyPageText();
    document.title = PAGE_TEXT[SITE.lang].readingTitle;
    document.addEventListener("click", e => {
      const copy = e.target.closest("[data-copy]");
      if (!copy) return;
      try { navigator.clipboard.writeText(copy.dataset.copy).then(() => { copy.textContent = SITE.ui.copied; }, () => { copy.textContent = SITE.ui.selectAddress; }); }
      catch (_) { copy.textContent = SITE.ui.selectAddress; }
    });
  </script>
</body>
</html>
